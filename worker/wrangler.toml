name = "flordelbosque-reservas"
main = "src/index.js"
compatibility_date = "2026-08-30"

# Dominio propio: evita depender de la URL workers.dev, que cambia con la cuenta,
# y deja el CORS apuntando a un origen estable. Va antes de cualquier [tabla]:
# en TOML una clave suelta pertenece a la última tabla declarada, y escrita más
# abajo terminaba anidada como triggers.routes, invisible para wrangler.
routes = [
  { pattern = "reservas.flordelbosque.cl", custom_domain = true }
]

# El cron del spec: cada 10 minutos.
[triggers]
crons = ["*/10 * * * *"]

# Caché de la disponibilidad. El id lo genera `wrangler kv namespace create CACHE`.
[[kv_namespaces]]
binding = "CACHE"
id = "30cfa39d108748cea09db57871431665"

# Envío de correo. El destino tiene que ser una DIRECCIÓN DE DESTINO verificada
# en Email Routing, y hola@flordelbosque.cl no lo es: es una regla de reenvío
# sobre el propio dominio ruteado, que Cloudflare rechaza con "destination
# address is not a verified address". Va entonces al buzón al que hola@ ya
# reenvía, así que llega al mismo lugar de siempre.
# OJO: si algún día se cambia a dónde reenvía hola@, hay que cambiarlo aquí
# también — este envío ya no pasa por esa regla.
[[send_email]]
name = "CORREO"
destination_address = "javielton@gmail.com"

[vars]
ORIGEN_PERMITIDO = "https://flordelbosque.cl"
DESTINATARIO = "javielton@gmail.com"
REMITENTE = "reservas@flordelbosque.cl"
