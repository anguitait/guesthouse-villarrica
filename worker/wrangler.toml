name = "flordelbosque-reservas"
main = "src/index.js"
compatibility_date = "2026-08-30"

# Dominio propio: evita depender de la URL workers.dev, que cambia con la cuenta,
# y deja el CORS apuntando a un origen estable. Va antes de cualquier [tabla]:
# en TOML una clave suelta pertenece a la última tabla declarada, y escrita más
# abajo terminaba anidada como triggers.routes, invisible para wrangler.
routes = [
  { pattern = "reservas.flordelbosque.cl", custom_domain = true }
]

# El cron del spec: cada 10 minutos.
[triggers]
crons = ["*/10 * * * *"]

# Caché de la disponibilidad. El id lo genera `wrangler kv namespace create CACHE`.
[[kv_namespaces]]
binding = "CACHE"
id = "30cfa39d108748cea09db57871431665"

# Envío de correo a un destino ya verificado en Email Routing.
[[send_email]]
name = "CORREO"
destination_address = "hola@flordelbosque.cl"

[vars]
ORIGEN_PERMITIDO = "https://flordelbosque.cl"
DESTINATARIO = "hola@flordelbosque.cl"
REMITENTE = "reservas@flordelbosque.cl"
